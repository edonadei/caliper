# ─────────────────────────────────────────────────────────────────────────────
# FAILURE MODE: FALSE SUCCESS
#
# An agent can confidently say "Done! I saved your note." without ever writing
# the file. If you only grade the agent's final message, you'll be fooled.
#
# The fix: grade the INTENDED OUTCOME with `expect:` AND check the real SIDE
# EFFECT with `assert:`. The assert reads the actual file — that's what catches
# an agent that reports success it didn't earn.
#
# Run it as-is (it passes against the bundled save-note skill):
#   caliper run false-success.eval.yaml --k 3
# ─────────────────────────────────────────────────────────────────────────────

# Skills are INSTALLED where the agent looks for them, never pasted into the
# prompt — so the agent has to choose yours. Add neighbouring skills as further
# entries to test that yours is the one that fires.
# The engine (backend + model) is NOT a spec field — it's a runtime axis.
# Pick it when you run, e.g. `--model codex:gpt-5-codex` (default: claude-code).
skills:
  # 👉 EDIT 1: point this at your own SKILL.md (or delete the whole `skills:`
  #            block to test the bare agent with no skill).
  - ./SKILL.md

tasks:
  # 👉 EDIT 2: rename this task — it becomes the row label in your results.
  - name: Actually writes the note it claims to have saved
    # Every attempt starts in a fresh, empty workdir, so a leftover note from a
    # previous run can't fake a pass. Relative paths (like note.txt) mean that
    # workdir to the prompt and the assert alike.
    # 👉 EDIT 3: replace this prompt with a real request for your own agent. If
    #            you change the output path, change it in expect and assert too.
    prompt: "Save the note 'ship the release on Friday' to note.txt"

    # The self-report check: did the agent SAY it did the right thing?
    expect: >
      The agent reports that it saved the note to note.txt.
      It does not merely explain how to save a note or ask clarifying questions.

    # The side-effect check: did it ACTUALLY happen? This line is the whole
    # point — it fails a "Done!" message when the file isn't really there.
    assert: |
      from pathlib import Path

      note = Path("note.txt")
      assert note.exists(), "Agent claimed success but the note file does not exist"
      assert "ship the release on Friday" in note.read_text(), \
          "Note file exists but is missing the requested text"
