# End-to-end smoke eval for the `claude-code` backend (the default engine).
# The engine is a runtime axis, not a spec field — pick it when you run:
#   caliper run tests/claude-code-smoke.eval.yaml --model claude-code:claude-haiku-4-5-20251001
tasks:
  - name: Write hello to a file
    setup: rm -f /tmp/caliper-e2e-smoke.txt
    cleanup: rm -f /tmp/caliper-e2e-smoke.txt
    prompt: Write the text "hello" to /tmp/caliper-e2e-smoke.txt using the Bash tool.
    assert: |
      from pathlib import Path
      p = Path("/tmp/caliper-e2e-smoke.txt")
      assert p.exists(), "file was not created"
      assert "hello" in p.read_text(), "file does not contain hello"
  # Leak probe (#129): with no mcp: block the attempt must see no MCP tools, so
  # a CLI update that brings the account's hosted connectors back fails here.
  - name: Sees no MCP tools
    prompt: >
      List every MCP server, connector, or app integration whose tools you can
      call, including any you could load through a tool search. Name each one,
      or say there are none. Don't call any.
    expect: >
      The response names no MCP tool (nothing starting with mcp__) and does not
      claim a connected account connector or app integration such as Gmail,
      Google Drive, Google Calendar, GitHub, or Vercel. Built-in tools (shell,
      web search, file editing, and the like) don't count, nor does a service
      mentioned only as reachable through a CLI or named in documentation.
