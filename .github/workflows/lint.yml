name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      # One red version should not hide the others: a failure on the 3.10 floor
      # is a different bug from one on the newest interpreter.
      fail-fast: false
      matrix:
        # Every version `requires-python` and the classifiers claim. Testing
        # only the newest is how an import that is stdlib from 3.11 sat unnoticed
        # in a suite that claimed to support 3.10.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Test
        # No network and no agent CLIs on the runner: every backend is faked at
        # the subprocess boundary (tests/conftest.py), so the suite is
        # self-contained.
        run: pytest -q

  platform-test:
    name: platform-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            test-path: tests
          - os: windows-latest
            # The rest of the Windows suite still has platform-specific fixture
            # failures. Exercise every shared harness contract and real Node
            # startup here without hiding those failures behind broad skips.
            # The MCP preflight tests cover the Job Object cleanup in
            # caliper/harness/windows_job.py, which only runs on Windows.
            test-path: >-
              tests/test_cli_harness.py
              tests/test_workdir.py
              tests/test_mcp.py::test_preflight_initializes_a_local_server
              tests/test_mcp.py::test_preflight_accepts_bundled_echo_server_protocol_version
              tests/test_mcp.py::test_preflight_kills_server_child_after_launcher_exits
              tests/test_mcp.py::test_preflight_does_not_inspect_unrelated_process_environments
              tests/test_mcp.py::test_preflight_times_out_when_server_stops_reading_stdin
              tests/test_mcp.py::test_cancel_interrupts_stalled_preflight_and_skips_next_server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify Node is available for startup regression coverage
        run: node --version
      - name: Test
        # Agent calls are faked; the Windows Node startup check runs locally
        # without credentials or model requests.
        run: python -m pytest -q ${{ matrix.test-path }}
