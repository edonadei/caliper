name: skill-evals

# Runs this repo's own skill evals (skills/*/*.eval.yaml) through the Caliper
# action in action.yml, on Codex with GPT-6 Luna, billed to a ChatGPT plan
# rather than an API key (docs/ci.md → Billing a ChatGPT plan).
#
# Off until the repository variable CALIPER_EVALS is "true", so a skills PR
# never goes red for want of a login. It also needs the secret CODEX_AUTH_JSON:
# the contents of ~/.codex/auth.json after `codex login`. CALIPER_RUNNER may
# name a self-hosted runner's labels as JSON (e.g. ["self-hosted","mybox"]);
# it defaults to ubuntu-latest.
#
# The base comparison comes from the Actions cache, refreshed by pushes to main.

on:
  pull_request:
    paths:
      - "skills/**"
  push:
    branches: [main]
    paths:
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# A newer push supersedes the run in flight: its attempts would be paid for
# and then discarded.
concurrency:
  group: skill-evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    # Never a fork's PR: it gets no secrets, and `uses: ./` runs the action
    # from the PR's own checkout, so a fork could rewrite it.
    if: >-
      vars.CALIPER_EVALS == 'true' && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ fromJSON(vars.CALIPER_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          specs: skills/*/*.eval.yaml
          # GPT-6 Luna runs the skill. The judge follows the backend on the
          # Codex CLI's default model (docs/adr/0034); add
          # judge-model: codex:gpt-6-luna to grade on Luna too.
          model: codex:gpt-6-luna
          codex-auth-json: ${{ secrets.CODEX_AUTH_JSON }}
          k: 3
          max-attempts: 60
          # A workflow_dispatch run has no diff: it runs every spec.
          changed-only: ${{ github.event_name != 'workflow_dispatch' }}
