skills:
  - ./SKILL.md
  # The neighbours: all three talk about evals, so every activates: below also
  # checks that the right one fires.
  - ../grill-skill/SKILL.md
  - ../evaluate-skill/SKILL.md

# Isolated: these numbers are published, and the user's own skills would
# otherwise compete for every activates: below (docs/adr/0028).
user_customizations: false

# Single-shot harness, so only the first turn is judged: a climb's rounds need
# answers and many agent sessions, which no attempt has.

tasks:
  # Task 1 — Framing before editing. The skill's first duty is to ask what to
  # optimize and get a go-ahead on the cost; an agent that starts rewriting the
  # skill has skipped the split, the baseline and the noise floor.
  - name: Frames the climb before touching the skill
    activates: [hillclimb-skill]
    setup: |
      mkdir -p commit-message
      cat > commit-message/SKILL.md << 'EOF'
      ---
      name: commit-message
      description: Use when the user wants a commit message for staged changes.
      allowed-tools: Bash
      ---

      # Commit Message

      Read the staged diff and write a conventional commit message.
      EOF
      {
        printf 'skills:\n  - ./SKILL.md\ntasks:\n'
        for i in 1 2 3 4 5 6 7 8 9; do
          printf '  - name: Writes a message for change %s\n' "$i"
          printf '    prompt: Write a commit message for the staged change in ./repo%s\n' "$i"
          printf '    expect: The message follows the conventional commit format.\n'
          printf '    activates: [commit-message]\n'
        done
      } > commit-message/commit-message.eval.yaml
      cp commit-message/SKILL.md original-SKILL.md
    prompt: >
      My skill at ./commit-message/SKILL.md has an eval beside it and passes
      about 60% of the time. Can you work on the skill yourself, round after
      round, until that number goes up? I'm here if you need anything from me
      before you start.
    expect: >
      Pass if the agent, before changing the skill or running the eval, asks the
      user at least one framing question (what to optimize, which part of the
      skill to change, how large a gain matters, or how many rounds to spend)
      and then stops to wait. Fail if it edits SKILL.md, starts an eval run, or
      proposes skill changes in this turn.
    assert: |
      before = open("original-SKILL.md").read()
      after = open("commit-message/SKILL.md").read()
      assert before == after, "Agent edited the skill before framing the climb"

  # Task 2 — Too few tasks to hold any out. The prompt answers the framing
  # questions up front, so a single shot reaches the refusal.
  - name: Refuses to climb an eval too small to hold tasks out
    activates: [hillclimb-skill]
    setup: |
      mkdir -p summarize
      cat > summarize/SKILL.md << 'EOF'
      ---
      name: summarize
      description: Use when the user wants to summarize a file.
      allowed-tools: Bash
      ---

      # Summarize

      Summarize the contents of a file provided by the user.
      EOF
      cat > summarize/summarize.eval.yaml << 'EOF'
      skills:
        - ./SKILL.md
      tasks:
        - name: Summarizes a short text file
          prompt: Summarize ./notes.txt
          expect: The agent produces a summary of the file contents.
        - name: Summarizes a long log
          prompt: What happened in ./server.log?
          expect: The agent reports the errors in the log.
        - name: Says so when the file is missing
          prompt: Summarize ./missing.txt
          expect: The agent reports that the file does not exist.
      EOF
      cp summarize/SKILL.md original-SKILL.md
    prompt: >
      Optimize ./summarize/SKILL.md against its eval on your own. I care about
      the score, change the body only, a 10-point gain is worth keeping, and you
      can spend up to four rounds. Go ahead, no need to check anything with me.
    expect: >
      Pass if the agent declines to start and says the eval has too few tasks to
      set some aside as held-out (or to measure a gain reliably), and suggests
      adding tasks first. Fail if it edits SKILL.md, runs the eval, or starts
      improving the skill anyway.
    assert: |
      import os
      before = open("original-SKILL.md").read()
      after = open("summarize/SKILL.md").read()
      assert before == after, "Agent edited the skill of an eval it should refuse"
      assert not os.path.exists(".caliper"), "Agent ran the eval it should refuse"

  # Task 3 — Over-rotation. Three train failures share a cause; a fourth is
  # one task's quirk, vivid enough to tempt a patch. The round's one change is
  # the shared cause, as a general rule; the quirk stays out of the skill.
  - name: Fixes the cause most failures share, not one task's detail
    activates: [hillclimb-skill]
    setup: |
      mkdir -p commit-message .caliper/hillclimb/commit-message
      cat > commit-message/SKILL.md << 'EOF'
      ---
      name: commit-message
      description: Use when the user wants a commit message for staged changes.
      allowed-tools: Bash
      ---

      # Commit Message

      Read the staged diff and write a conventional commit message.
      EOF
      cp commit-message/SKILL.md original-SKILL.md
      {
        printf 'skills:\n  - ./SKILL.md\ntasks:\n'
        for i in 1 2 3 4 5 6 7 8 9; do
          printf '  - name: Writes a message for change %s\n' "$i"
          printf '    prompt: Write a commit message for the staged change in ./repo%s\n' "$i"
          printf '    expect: The message follows the conventional commit format.\n'
        done
      } > commit-message/commit-message.eval.yaml
      python3 - << 'EOF'
      import json
      H = ".caliper/hillclimb/commit-message/"
      name = "Writes a message for change {}".format
      long = ("The subject line runs to {} characters. A conventional commit "
              "keeps the subject under 72 and puts the detail in the body.")
      why = {
          1: long.format(94), 2: long.format(88), 4: long.format(101), 8: long.format(90),
          5: "The diff touches billing/invoice.py. The team cites the ticket for "
             "billing changes, so the message needed 'Refs: PAY-4471' in its footer.",
      }
      def attempt(n, task):
          failed = task in why and not (task == 5 and n > 1)
          return {"attempt": n, "outcome": "task_fail" if failed else "pass",
                  "activated": ["commit-message"],
                  "autorater_reasoning": why[task] if failed else "Follows the format."}
      tasks = [{"task_name": name(i),
                "prompt": f"Write a commit message for the staged change in ./repo{i}",
                "expect": "The message follows the conventional commit format.",
                "attempts": [attempt(n, i) for n in range(1, 6)]} for i in range(1, 10)]
      for base in ("base-1.json", "base-2.json"):
          open(H + base, "w").write(json.dumps({"task_results": tasks}))
      json.dump({"surface": "body", "skill": None, "seed": 7,
                 "train": [name(i) for i in range(1, 7)],
                 "held_out": [name(i) for i in range(7, 10)]},
                open(H + "state.json", "w"))
      open(H + "log.md", "w").write(
          "framing: score · body · 10 pp · 6 rounds\n"
          "baseline: train 47%, held-out 67%; noise floor train 7 pp, held-out 13 pp\n")
      EOF
    prompt: >
      We're hillclimbing ./commit-message/SKILL.md. The framing is agreed
      (score, body only, 10 pp, 6 rounds), and the split and both baselines are
      done under .caliper/hillclimb/commit-message/, with base-2.json as the
      current best. Do round 1 up to the run: read the train failures and make
      the round's change, then stop. I'll start the run myself.
    expect: >
      Pass if the agent edits the skill once, for the cause most train failures
      share (subject lines too long), written as a general rule about the
      subject line, and stops without running the eval. Fail if the edit adds a
      rule for the single billing failure (a ticket, a footer, billing files),
      copies wording from a task, fixes several causes at once, or runs the eval.
    assert: |
      import os
      before = open("original-SKILL.md").read()
      after = open("commit-message/SKILL.md").read()
      assert after != before, "Agent made no change this round"
      for bait in ("PAY-4471", "billing", "invoice", "Refs:", "ticket"):
          assert bait.lower() not in after.lower(), f"The skill now carries one task's detail: {bait}"
      grown = len(after.split()) - len(before.split())
      assert grown <= 80, f"One cause grew the skill by {grown} words"
      H = ".caliper/hillclimb/commit-message"
      assert not os.path.exists(".caliper/results"), "Agent ran the eval"
      assert not os.path.exists(f"{H}/round-1.json"), "Agent ran the eval"

  # Task 4 — Drift under a cost climb. Round 4 cuts tokens and sits inside the
  # noise floor against the current best, but kept rounds have already eroded
  # held-out: from the baseline it fell past its floor, so the round reverts.
  - name: Reverts a cost round that drifts from the baseline
    activates: [hillclimb-skill]
    setup: |
      mkdir -p triage .caliper/hillclimb/triage/round-4-before
      cat > .caliper/hillclimb/triage/round-4-before/SKILL.md << 'EOF'
      ---
      name: triage
      description: Use when the user wants an incoming bug report triaged.
      ---

      # Triage

      Label the report's severity (S1 to S4) and its component.

      ## Severity

      S1 is data loss or an outage, S2 a broken feature with no workaround, S3
      one with a workaround, S4 cosmetic.

      ## When the report is thin

      Ask for the version and the steps to reproduce before labeling.
      EOF
      cat > triage/SKILL.md << 'EOF'
      ---
      name: triage
      description: Use when the user wants an incoming bug report triaged.
      ---

      # Triage

      Label the report's severity (S1 to S4) and its component.

      ## Severity

      S1 is data loss or an outage, S2 a broken feature with no workaround, S3
      one with a workaround, S4 cosmetic.
      EOF
      cp .caliper/hillclimb/triage/round-4-before/SKILL.md before-round-4.md
      cat > .caliper/hillclimb/triage/log.md << 'EOF'
      framing: cost · body · 10 pp · 6 rounds
      baseline: train 80%, held-out 78%; noise floor train 6 pp, held-out 10 pp; tokens/attempt 52K
      r1 cut repeated severity examples · train 80->80, held-out 78->75 · tokens -7% · kept
      r2 moved the component list to REFERENCE.md · train 80->78, held-out 75->72 · tokens -6% · kept
      r3 shortened the severity table · train 78->70, held-out 72->70 · tokens -4% · reverted
      EOF
    prompt: >
      Round 4 of the cost climb on ./triage/SKILL.md just finished: it dropped
      the "When the report is thin" section. climb.py scores printed, against
      the current best (round 2): train 78% -> 76% (-2 pp), held-out 72% -> 64%
      (-8 pp), tokens/attempt 48K -> 44K (-9%). Against the baseline: train
      80% -> 76% (-4 pp), held-out 78% -> 64% (-14 pp), tokens/attempt
      52K -> 44K (-15%). Give the verdict and act on it. The climb's files are
      under .caliper/hillclimb/triage/.
    expect: >
      Pass if the agent reverts round 4, restoring ./triage/SKILL.md from
      round-4-before/, because held-out fell beyond its 10 pp noise floor from
      the baseline, even though the fall against the current best is inside
      it, and logs the round as reverted. Fail if it keeps the change, or
      judges the round only against the current best.
    assert: |
      restored = open("triage/SKILL.md").read()
      assert restored == open("before-round-4.md").read(), "Round 4's cut was kept"

  # Trigger probe: designing an eval belongs to grill-skill.
  - name: A skill with no eval belongs to grill-skill
    activates: [grill-skill]
    setup: |
      mkdir -p changelog-writer
      printf -- '---\nname: changelog-writer\ndescription: Use when the user wants to turn merged PRs into a changelog entry.\n---\n\n# Changelog Writer\n' > changelog-writer/SKILL.md
    prompt: >
      I need an eval for ./changelog-writer/SKILL.md and I can't think of good
      test cases. How do we start?

  # Trigger probe: a plain validation request belongs to evaluate-skill.
  - name: A validation request belongs to evaluate-skill
    activates: [evaluate-skill]
    setup: |
      printf -- '---\nname: arithmetic\ndescription: Use when asked to do arithmetic.\n---\n\n# Arithmetic\n' > SKILL.md
      printf 'skills:\n  - ./SKILL.md\ntasks:\n  - name: Adds\n    prompt: What is 2 + 2?\n    expect: The answer is 4.\n' > valid.eval.yaml
    prompt: Is the caliper spec at ./valid.eval.yaml valid?

  # Trigger probe: ordinary work, no eval in sight.
  - name: Unrelated work stays silent
    activates: []
    setup: |
      printf 'def total(items):\n    tmp = 0\n    for i in items:\n        tmp += i\n    return tmp\n' > a.py
    prompt: Rename the variable tmp to result in ./a.py
