skills:
  - ./SKILL.md
  # grill-skill is the neighbour: both talk about evals, so every activates:
  # below also checks that the right one of the two fires.
  - ../grill-skill/SKILL.md

# The engine (backend + model) is a runtime axis, not a spec field — run this
# eval with `--model codex --judge-model codex` (or any other engine).

# No explicit sandbox.forbidden_files: caliper auto-forbids this spec and any
# .caliper/results/ directory. Listing "./.caliper/.*" by hand risks a false
# cheat flag, because these tasks legitimately WRITE caliper specs whose text
# contains that very pattern — see the same note in grill-skill.eval.yaml.

tasks:
  # Every attempt runs in a fresh attempt workdir (docs/adr/0026), so fixtures
  # are built there with relative paths — fixed /tmp paths would collide across
  # attempts running in parallel.
  - name: Validates a well-formed spec and reports it as valid
    activates: [evaluate-skill]
    setup: |
      printf -- '---\nname: arithmetic\ndescription: Use when asked to do arithmetic.\n---\n\n# Arithmetic\n' > SKILL.md
      cat > valid.eval.yaml << 'EOF'
      skills:
        - ./SKILL.md
      tasks:
        - name: Test arithmetic
          prompt: What is 2 + 2?
          expect: The assistant answers 4.
      EOF
    prompt: >
      Use caliper to validate the spec file at ./valid.eval.yaml and tell me
      whether it is valid.
    expect: >
      The agent runs caliper validate on ./valid.eval.yaml and reports that the
      spec is valid with no errors.
    assert: |
      import subprocess

      result = subprocess.run(
          ["caliper", "validate", "valid.eval.yaml"],
          capture_output=True, text=True
      )
      assert result.returncode == 0, f"caliper validate exited {result.returncode}: {result.stderr}"

  - name: Identifies errors in an invalid spec without fixing it
    activates: [evaluate-skill]
    setup: |
      printf -- '---\nname: arithmetic\ndescription: Use when asked to do arithmetic.\n---\n\n# Arithmetic\n' > SKILL.md
      cat > invalid.eval.yaml << 'EOF'
      skills:
        - ./SKILL.md
      tasks:
        - name: Broken task
          prompt: do something
      EOF
    prompt: >
      Use caliper to validate the spec file at ./invalid.eval.yaml and tell me
      what errors it contains.
    expect: >
      The agent runs caliper validate and reports that the spec is invalid,
      describing that the task is missing an expect, assert or activates field.
      The agent does not edit the invalid spec file.
    assert: |
      import yaml

      with open("invalid.eval.yaml") as f:
          spec = yaml.safe_load(f)
      task = spec["tasks"][0]
      assert set(task) == {"name", "prompt"}, f"The invalid spec was edited: {task}"

  - name: Creates an engineless eval spec and defers the engine to run time
    activates: [evaluate-skill]
    prompt: >
      Create an evaluation spec file at ./created.eval.yaml for a skill at
      ./SKILL.md that I intend to run on the Codex CLI. Include one task named
      "Answers arithmetic", with prompt "What is 2 + 2?" and expectation "The
      assistant answers 4." Then tell me how to run it against Codex.
    expect: >
      A valid .eval.yaml file is written at ./created.eval.yaml with a
      top-level skills: list containing ./SKILL.md and the requested task. The
      spec does NOT pin a backend or model (no skill.backend/model, no judge
      block) because the engine is a runtime axis, and the agent tells the user
      to select Codex at run time with `caliper run ... --model codex`
      (optionally `--judge-model codex`).
    assert: |
      import os
      import yaml

      path = "created.eval.yaml"
      assert os.path.exists(path), "Spec file was not created"
      with open(path) as f:
          spec = yaml.safe_load(f)
      assert "skill" not in spec, "`skill:` was replaced by the `skills:` list"
      skills = spec.get("skills")
      assert isinstance(skills, list) and skills, \
          f"spec needs a top-level skills: list, got {skills!r}"
      def pa(e): return e if isinstance(e, str) else (e or {}).get("path")
      assert pa(skills[0]) == "./SKILL.md", "skills[0] should be ./SKILL.md"
      assert "judge" not in spec, "engine is a runtime axis: no judge block belongs in the spec"
      assert len(spec.get("tasks", [])) == 1, "Expected exactly one task"
      task = spec["tasks"][0]
      assert task["name"] == "Answers arithmetic", "Unexpected task name"
      assert task["prompt"] == "What is 2 + 2?", "Unexpected prompt"
      assert task["expect"] == "The assistant answers 4.", "Unexpected expectation"

  - name: Explains independent skill and judge engines are selected at run time
    activates: [evaluate-skill]
    prompt: >
      Create an evaluation spec file at ./mixed-backend.eval.yaml that evaluates
      a Claude Code skill at ~/.claude/skills/review/SKILL.md but is judged by
      Codex. Include one task named "Reviews staged changes", prompt "Review the
      staged changes", and expectation "The review reports at least one
      actionable issue." Then tell me the exact command to run it that way.
    expect: >
      The agent writes a valid engineless spec (a skills: list containing
      ~/.claude/skills/review/SKILL.md, no backend/model, no judge block) and
      explains that the skill and judge engines are chosen independently at run
      time — e.g. `caliper run ... --model claude-code --judge-model codex` —
      because Caliper treats the engine as a runtime axis, not a spec field.
    assert: |
      import os
      import yaml

      path = "mixed-backend.eval.yaml"
      assert os.path.exists(path), "Spec file was not created"
      with open(path) as f:
          spec = yaml.safe_load(f)
      assert "skill" not in spec, "`skill:` was replaced by the `skills:` list"
      skills = spec.get("skills")
      assert isinstance(skills, list) and skills, \
          f"spec needs a top-level skills: list, got {skills!r}"
      def pa(e): return e if isinstance(e, str) else (e or {}).get("path")
      assert pa(skills[0]) == "~/.claude/skills/review/SKILL.md", "Unexpected skill path"
      assert "judge" not in spec, "engine is a runtime axis: no judge block belongs in the spec"
      assert spec["tasks"][0]["name"] == "Reviews staged changes", "Unexpected task name"

  - name: Lists available evaluations gracefully
    activates: [evaluate-skill]
    prompt: >
      Use caliper to list all available evaluations and tell me what you find.
    expect: >
      The agent runs caliper list and either shows a table of available evaluations
      with scores and timestamps, or clearly states that no results have been recorded yet

  - name: Surfaces Claude Code configuration errors clearly
    activates: [evaluate-skill]
    setup: cp -R "$CALIPER_SPEC_DIR/references/evals/claude-code-smoke" .
    prompt: >
      Run the Claude Code smoke eval at
      ./claude-code-smoke/claude-code-smoke.eval.yaml with k=1, one worker and
      a 60 second timeout. If Claude Code is not logged in or the account lacks
      access, report the Caliper configuration error clearly instead of
      describing it as a task failure.
    expect: >
      The agent runs caliper run ./claude-code-smoke/claude-code-smoke.eval.yaml
      with --k 1 --workers 1 --timeout 60. If the run exits with a Claude Code
      configuration error, the agent reports that configuration problem and the
      relevant login or access guidance. If Claude Code is configured, the agent
      reports the eval result normally.

  # Diagnosis: each fixture is real `caliper report` / `caliper compare` output,
  # rendered from the reporter for one branch of the diagnosis table.
  - name: Traces a skill that never fired to its description
    activates: [evaluate-skill]
    setup: cp "$CALIPER_SPEC_DIR/fixtures/report-activation-fails.txt" report.txt
    prompt: >
      I ran the eval for my release-notes skill and saved the output to
      ./report.txt. What should I change in the skill, and where? Don't edit
      anything yet.
    expect: >
      Pass if the agent reads the report, notices that release-notes never
      activated (activation 0%, "activated: (nothing)" on every attempt), and
      says the fix belongs in the skill's description / frontmatter, which
      decides whether the agent reaches for it. Fail if its main
      recommendation is to change the skill's body instructions (for example
      adding a "Breaking changes" section) without identifying that the skill
      never fired.

  - name: Traces a skill that fired but failed to its body
    activates: [evaluate-skill]
    setup: cp "$CALIPER_SPEC_DIR/fixtures/report-body-fails.txt" report.txt
    prompt: >
      I ran the eval for my release-notes skill and saved the output to
      ./report.txt. What should I change in the skill, and where? Don't edit
      anything yet.
    expect: >
      Pass if the agent notices that release-notes activated on every attempt
      (activation 100%), so the description is working, and says the fix
      belongs in the skill's body: the "Drafts release notes for v2.2" task
      fails 2 of 3 times because the output lacks a "Breaking changes"
      section. Fail if it recommends changing the description or frontmatter
      as the fix.

  - name: Does not call the skill proven when the control nearly matches
    activates: [evaluate-skill]
    setup: cp "$CALIPER_SPEC_DIR/fixtures/compare-control-matches.txt" compare.txt
    prompt: >
      I compared my release-notes skill against a run with it removed, output
      in ./compare.txt. Does this prove the skill is worth shipping?
    expect: >
      Pass if the agent says this does not yet prove it: without the skill the
      agent already scores 100% on "Drafts release notes for v2.2", so that
      task doesn't need the skill, and the +33.3% on the other task is a single
      attempt at k=3. It recommends sharpening the tasks and/or re-running at
      a higher k (5 or more) before concluding. Fail if it declares the skill
      proven or ready to ship on the strength of the +16.7% overall delta.

  # Trigger probes: no judge, cheap.
  - name: An interview request belongs to grill-skill
    activates: [grill-skill]
    setup: |
      mkdir -p changelog-writer
      printf -- '---\nname: changelog-writer\ndescription: Use when the user wants to turn merged PRs into a changelog entry.\n---\n\n# Changelog Writer\n' > changelog-writer/SKILL.md
    prompt: >
      I have a skill at ./changelog-writer/SKILL.md with no eval yet. Interview
      me about what it should do and help me design its eval tasks.

  - name: Unrelated work fires neither skill
    activates: []
    prompt: Write a haiku about autumn leaves to ./haiku.txt.
