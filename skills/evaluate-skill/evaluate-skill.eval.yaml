skills:
  - ./SKILL.md
  # grill-skill is the neighbour: both talk about evals, so every activates:
  # below also checks that the right one of the two fires.
  - ../grill-skill/SKILL.md

# Isolated: these numbers are published, and the user's own skills would
# otherwise compete for every activates: below (docs/adr/0028).
user_customizations: false

# The engine (backend + model) is a runtime axis, not a spec field — run this
# eval with `--model codex --judge-model codex` (or any other engine).

# No explicit sandbox.forbidden_files: caliper auto-forbids this spec and any
# .caliper/results/ directory. Listing "./.caliper/.*" by hand risks a false
# cheat flag, because these tasks legitimately WRITE caliper specs whose text
# contains that very pattern — see the same note in grill-skill.eval.yaml.

tasks:
  # Every attempt runs in a fresh attempt workdir (docs/adr/0026), so fixtures
  # are built there with relative paths — fixed /tmp paths would collide across
  # attempts running in parallel.
  #
  # No one-command tasks (validate a spec, list the runs): at k=5 the agent
  # without this skill passed all three from `caliper --help`, at the same
  # cost, and no skill fired.
  - name: Creates an engineless eval spec and defers the engine to run time
    activates: [evaluate-skill]
    prompt: >
      Create an evaluation spec file at ./created.eval.yaml for a skill at
      ./SKILL.md that I intend to run on the Codex CLI. Include one task named
      "Answers arithmetic", with prompt "What is 2 + 2?" and expectation "The
      assistant answers 4." Then tell me how to run it against Codex.
    expect: >
      A valid .eval.yaml file is written at ./created.eval.yaml with a
      top-level skills: list containing ./SKILL.md and the requested task. The
      spec does NOT pin a backend or model (no skill.backend/model, no judge
      block) because the engine is a runtime axis, and the agent tells the user
      to select Codex at run time with `caliper run ... --model codex`
      (optionally `--judge-model codex`).
    assert: |
      import os
      import yaml

      path = "created.eval.yaml"
      assert os.path.exists(path), "Spec file was not created"
      with open(path) as f:
          spec = yaml.safe_load(f)
      assert "skill" not in spec, "`skill:` was replaced by the `skills:` list"
      skills = spec.get("skills")
      assert isinstance(skills, list) and skills, \
          f"spec needs a top-level skills: list, got {skills!r}"
      def pa(e): return e if isinstance(e, str) else (e or {}).get("path")
      assert pa(skills[0]) == "./SKILL.md", "skills[0] should be ./SKILL.md"
      assert "judge" not in spec, "engine is a runtime axis: no judge block belongs in the spec"
      assert len(spec.get("tasks", [])) == 1, "Expected exactly one task"
      task = spec["tasks"][0]
      assert task["name"] == "Answers arithmetic", "Unexpected task name"
      assert task["prompt"] == "What is 2 + 2?", "Unexpected prompt"
      assert task["expect"] == "The assistant answers 4.", "Unexpected expectation"

  - name: Explains independent skill and judge engines are selected at run time
    activates: [evaluate-skill]
    prompt: >
      Create an evaluation spec file at ./mixed-backend.eval.yaml that evaluates
      a Claude Code skill at ~/.claude/skills/review/SKILL.md but is judged by
      Codex. Include one task named "Reviews staged changes", prompt "Review the
      staged changes", and expectation "The review reports at least one
      actionable issue." Then tell me the exact command to run it that way.
    expect: >
      The agent writes a valid engineless spec (a skills: list containing
      ~/.claude/skills/review/SKILL.md, no backend/model, no judge block) and
      gives a run command that picks the two engines separately at run time:
      `caliper run ... --model claude-code --judge-model codex` (the default
      `--model` may be left out).
    assert: |
      import os
      import yaml

      path = "mixed-backend.eval.yaml"
      assert os.path.exists(path), "Spec file was not created"
      with open(path) as f:
          spec = yaml.safe_load(f)
      assert "skill" not in spec, "`skill:` was replaced by the `skills:` list"
      skills = spec.get("skills")
      assert isinstance(skills, list) and skills, \
          f"spec needs a top-level skills: list, got {skills!r}"
      def pa(e): return e if isinstance(e, str) else (e or {}).get("path")
      assert pa(skills[0]) == "~/.claude/skills/review/SKILL.md", "Unexpected skill path"
      assert "judge" not in spec, "engine is a runtime axis: no judge block belongs in the spec"
      assert spec["tasks"][0]["name"] == "Reviews staged changes", "Unexpected task name"

  - name: Surfaces Claude Code configuration errors clearly
    activates: [evaluate-skill]
    setup: |
      mkdir claude-code-smoke
      cat > claude-code-smoke/SKILL.md << 'EOF'
      ---
      name: claude-code-smoke
      description: Use when asked to run the Claude Code smoke evaluation.
      ---

      When asked to run the smoke evaluation, write exactly
      `claude-code-smoke-ok` to the requested output file.
      EOF
      cat > claude-code-smoke/claude-code-smoke.eval.yaml << 'EOF'
      skills:
        - ./SKILL.md
      tasks:
        - name: Writes the smoke output file
          prompt: Run the Claude Code smoke evaluation and write the result to ./smoke.txt.
          activates: [claude-code-smoke]
          assert: |
            from pathlib import Path
            assert Path("smoke.txt").read_text().strip() == "claude-code-smoke-ok"
      EOF
    prompt: >
      Run the Claude Code smoke eval at
      ./claude-code-smoke/claude-code-smoke.eval.yaml with k=1, one worker and
      a 60 second timeout. If Claude Code is not logged in or the account lacks
      access, report the Caliper configuration error clearly instead of
      describing it as a task failure.
    expect: >
      The agent runs caliper run ./claude-code-smoke/claude-code-smoke.eval.yaml
      with --k 1 --workers 1 --timeout 60. If the run exits with a
      configuration error, the agent reports the problem the run named as a
      configuration problem, with the guidance the error gave, and not as a
      task failure. If Claude Code is configured, the agent reports the eval
      result normally.

  # Writing a spec whose tasks the user already decided is this skill's job
  # (grill-skill owns the interview). The prompt mentions neither rule, so
  # activates: on every execution task and skill-free prompts must come from
  # the skill.
  - name: Generated tasks assert activates and never name the skill
    activates: [evaluate-skill]
    setup: |
      mkdir -p hello-file
      cat > hello-file/SKILL.md << 'EOF'
      ---
      name: hello-file
      description: Use when the user wants to write a greeting file.
      allowed-tools: Bash
      ---

      # Hello File

      Write the text "hello world" to ./hello.txt when the user asks.
      EOF
    prompt: >
      Write the eval spec for my skill at ./hello-file/SKILL.md now, to
      ./hello-file/hello-file.eval.yaml, without asking me anything more; I have
      answered everything. Happy path: I ask for a greeting file and
      ./hello.txt contains "hello world". Edge case: I ask for the greeting
      "hi there" instead. Adversarial: I ask it to overwrite /etc/hosts, and it
      must refuse. Don't run it.
    expect: >
      A valid .eval.yaml is written at ./hello-file/hello-file.eval.yaml
      covering the happy path, edge case and adversarial case.
    assert: |
      import yaml

      with open("hello-file/hello-file.eval.yaml") as f:
          spec = yaml.safe_load(f)
      tasks = spec.get("tasks") or []
      execution = [t for t in tasks if "expect" in t or "assert" in t]
      assert execution, "no execution tasks"
      for t in execution:
          assert "hello-file" in (t.get("activates") or []), \
              f"task {t.get('name')!r} does not assert activates: [hello-file]"
      for t in tasks:
          prompt = str(t.get("prompt", "")).lower()
          assert "hello-file" not in prompt and "skill" not in prompt, \
              f"task {t.get('name')!r} names the skill in its prompt: {prompt!r}"

  # A user who has decided the tasks still gets trigger probes proposed:
  # graded on the proposal, not written to disk.
  - name: Proposes trigger probes for tasks the user has decided
    activates: [evaluate-skill]
    setup: |
      mkdir -p changelog-writer
      cat > changelog-writer/SKILL.md << 'EOF'
      ---
      name: changelog-writer
      description: Use when the user wants to turn merged PRs into a changelog entry.
      allowed-tools: Bash, Read, Write
      ---

      # Changelog Writer

      Read the merged PRs since the last tag and write a grouped changelog
      entry (Features / Fixes / Chore) to CHANGELOG.md.
      EOF
    prompt: >
      I want an eval for my skill at ./changelog-writer/SKILL.md. It runs
      `gh pr list --state merged` for PRs since the last git tag and writes a
      grouped entry to CHANGELOG.md; a test can fake `gh` and tag the repo in
      setup. Happy path: three merged PRs (a feature, a fix, a
      chore) become one entry with Features / Fixes / Chore headings. Edge
      case: a PR labelled both feature and fix goes under Features only.
      Adversarial: asked to rewrite old released entries, it should refuse. I
      don't know of any other skills it could be confused with. Before you
      write anything, show me the tasks you'd put in the spec.
    expect: >
      Pass if the agent shows a proposed set of tasks, without writing the spec
      file, and the proposal includes at least one trigger probe: a silence
      probe (unrelated work with `activates: []`) or a neighbour probe. Its
      execution tasks (happy path, edge case, adversarial) assert
      `activates: [changelog-writer]`. Fail if it writes the spec file, or its
      proposal has no trigger probe.
    assert: |
      import glob
      specs = glob.glob("changelog-writer/*.eval.yaml")
      assert not specs, f"Agent wrote the spec before showing the proposal: {specs}"

  # Advising the next run is operating an eval: the control comes first.
  - name: Runs the control before iterating on the skill
    activates: [evaluate-skill]
    setup: |
      mkdir -p changelog-writer
      cat > changelog-writer/SKILL.md << 'EOF'
      ---
      name: changelog-writer
      description: Use when the user wants to turn merged PRs into a changelog entry.
      allowed-tools: Bash, Read, Write
      ---

      # Changelog Writer

      Read the merged PRs since the last tag and write a grouped changelog
      entry (Features / Fixes / Chore) to CHANGELOG.md.
      EOF
      cat > changelog-writer/changelog-writer.eval.yaml << 'EOF'
      skills:
        - ./SKILL.md
      tasks:
        - name: Groups three merged PRs by type
          prompt: Write the changelog entry for the PRs merged since v1.0.
          expect: CHANGELOG.md gains one entry with Features, Fixes and Chore headings.
          activates: [changelog-writer]
      EOF
    prompt: >
      My eval at ./changelog-writer/changelog-writer.eval.yaml validated and its
      k=1 run was clean, no harness errors. Before I start editing SKILL.md,
      what run should come next, and why? Just tell me; don't run anything.
    expect: >
      Pass if the agent recommends running the control next, i.e. the same
      tasks with the skill removed (`--ablate changelog-writer`), alongside a
      full run and a `caliper compare`, to check that the tasks actually need
      the skill before iterating on it. Fail if it recommends going straight to
      editing the skill or to repeated full runs without that control.

  # The control keeps the neighbourhood. The bare agent needs every declared
  # skill and server removed and the run isolated, which only this skill says.
  - name: Strips the whole neighbourhood to measure the bare agent
    activates: [evaluate-skill]
    setup: |
      mkdir -p pr-describer lint-helper servers
      printf -- '---\nname: pr-describer\ndescription: Use when the user wants a pull request description written from the branch diff.\n---\n\n# PR Describer\n' > pr-describer/SKILL.md
      printf -- '---\nname: lint-helper\ndescription: Use when the user wants lint errors explained.\n---\n\n# Lint Helper\n' > lint-helper/SKILL.md
      printf 'print("stub")\n' > servers/tracker.py
      cat > pr-describer/pr-describer.eval.yaml << 'EOF'
      skills:
        - ./SKILL.md
        - ../lint-helper/SKILL.md
      mcp:
        tracker:
          command: python3
          args: [../servers/tracker.py]
      tasks:
        - name: Describes a two-commit branch
          prompt: Write the description for this branch's pull request.
          expect: The description summarises both commits and links the ticket.
          activates: [pr-describer]
      EOF
    prompt: >
      My eval is at ./pr-describer/pr-describer.eval.yaml. I want to know what
      pr-describer adds over the bare agent. Put the exact commands in
      ./bare.sh for me to run later; don't run anything.
    expect: >
      Pass if ./bare.sh runs the spec twice and compares the two: one full run,
      and one with every declared skill and server removed (pr-describer,
      lint-helper and the tracker MCP server), both isolated from the user's
      own customizations. Fail if the second run removes only pr-describer.
    assert: |
      import re
      from pathlib import Path

      script = Path("bare.sh").read_text()
      ablated = set(re.findall(r"--ablate[= ]+(?:skill:|mcp:)?([\w-]+)", script))
      assert {"pr-describer", "lint-helper", "tracker"} <= ablated, \
          f"the bare run keeps part of the neighbourhood: ablated {sorted(ablated)}"
      spec = Path("pr-describer/pr-describer.eval.yaml").read_text()
      assert "--no-user-customizations" in script or "user_customizations: false" in spec, \
          "the runs load the user's own customizations"

  # Reading a report or a compare table needs no skill: across two fixture
  # sets (six tasks, k=1) the bare agent did it as well. The two tasks below
  # test rules instead, which the output never states: what counts in the
  # score, and that activation stays out of it.
  - name: Scores usable attempts only
    activates: [evaluate-skill]
    prompt: >
      My run at k=5 over four tasks finished with 20 attempts: 9 pass, 2
      task_fail, 1 cheat, 6 infra_error and 2 timeout. So the skill is at 45%,
      right? What do I fix first?
    expect: >
      Pass if the agent corrects the score to 75% (9 of the 12 usable attempts:
      infra_error and timeout are excluded, cheat counts as a failure), says
      the 8 unusable attempts are an environment problem to fix and re-run, and
      places the cheat in the task rather than the skill. Fail if it accepts
      45% or scores over all 20 attempts.

  - name: Keeps activation and success rate as two numbers
    activates: [evaluate-skill]
    prompt: >
      My last run: 9 of 12 graded attempts passed, and the skill fired on 20 of
      the 30 attempts where it should have. I need one overall score for a
      slide. What is it?
    expect: >
      Pass if the agent reports the success rate (75%) and the activation score
      (67%) as two separate numbers and declines to average or otherwise
      combine them. Fail if it gives a single blended score.

  # Trigger probes: no judge, cheap.
  - name: An interview request belongs to grill-skill
    activates: [grill-skill]
    setup: |
      mkdir -p changelog-writer
      printf -- '---\nname: changelog-writer\ndescription: Use when the user wants to turn merged PRs into a changelog entry.\n---\n\n# Changelog Writer\n' > changelog-writer/SKILL.md
    prompt: >
      I have a skill at ./changelog-writer/SKILL.md with no eval yet. Interview
      me about what it should do and help me design its eval tasks.

  - name: Unrelated work fires neither skill
    activates: []
    prompt: Write a haiku about autumn leaves to ./haiku.txt.
