skills:
  - ./SKILL.md
  # evaluate-skill is the neighbour: both talk about evals, so every
  # activates: below also checks that the right one of the two fires.
  - ../evaluate-skill/SKILL.md

# The engine (backend + model) is a runtime axis, not a spec field — this eval
# runs on whatever `--model` / `--judge-model` select (default claude-code).

# No explicit sandbox.forbidden_files: caliper already auto-forbids the eval
# spec and any .caliper/results/ directory. Listing "./.caliper/.*" here caused a
# false cheat flag, because these grill-skill tasks legitimately WRITE caliper
# specs whose text contains that very pattern.

tasks:
  # Task 1 — First-turn interview discipline (open prompt, no eval present).
  # Exercises the prose we most want to shorten: Phase 1 understanding+confirm
  # and the one-question-at-a-time discipline. Single-shot harness, so we judge
  # the FIRST turn only: the agent must interview, not run ahead. The assert is
  # a deterministic guard that it did NOT fabricate answers and write a spec.
  - name: Interviews before generating — asks, then stops (does not run ahead)
    activates: [grill-skill]
    setup: |
      mkdir -p changelog-writer
      cat > changelog-writer/SKILL.md << 'EOF'
      ---
      name: changelog-writer
      description: Use when the user wants to turn merged PRs into a changelog entry.
      allowed-tools: Bash, Read, Write
      ---

      # Changelog Writer

      Read the merged PRs since the last tag and write a grouped changelog
      entry (Features / Fixes / Chore) to CHANGELOG.md.
      EOF
    prompt: >
      I want to create a caliper eval for my skill at
      ./changelog-writer/SKILL.md. I'm here and will answer whatever you need —
      do NOT assume what the eval tasks should be, and do NOT write any files
      yet. What do you need to know from me to get started?
    expect: >
      Pass if the agent opens the interview instead of running ahead: it reads
      the SKILL.md, gives some understanding of the skill, and asks the user for
      input before generating anything — then STOPS to wait. The number of
      questions does not matter. Fail if the agent skips the interview: it
      invents the user's answers, generates the eval tasks itself without
      asking, or writes any .eval.yaml file in this turn.
    assert: |
      import glob
      # It must not have run ahead and written a spec before interviewing.
      specs = glob.glob("changelog-writer/*.eval.yaml")
      assert not specs, f"Agent wrote a spec without interviewing: {specs}"

  # Task 2 — Gap-fill detection + no silent overwrite (open prompt, eval present).
  # Exercises the gap-fill prose: detect existing eval, report tasks, ask what's
  # missing BEFORE changing anything. Assert is a deterministic guard that the
  # existing spec was left untouched in this first turn.
  - name: Detects an existing eval and asks before touching it
    activates: [grill-skill]
    setup: |
      mkdir -p summarize
      cat > summarize/SKILL.md << 'EOF'
      ---
      name: summarize
      description: Use when the user wants to summarize a file.
      allowed-tools: Bash
      ---

      # Summarize

      Summarize the contents of a file provided by the user.
      EOF
      cat > summarize/summarize.eval.yaml << 'EOF'
      skills:
        - ./SKILL.md
      tasks:
        - name: Summarizes a short text file
          prompt: Summarize ./notes.txt
          expect: The agent produces a summary of the file contents.
      EOF
    prompt: >
      I want to improve the eval for my skill at
      ./summarize/SKILL.md. I'm here to answer your
      questions — do NOT change any files yet. Tell me the current state of my
      eval and what you need from me.
    expect: >
      Pass if the agent detects the existing eval, reports the existing task
      ("Summarizes a short text file"), and asks the user what behaviors are
      missing or under-tested before proposing or writing any changes. Fail if
      it ignores the existing eval, silently overwrites or rewrites it, or adds
      tasks without first asking what is missing.
    assert: |
      import yaml
      # The existing spec must be untouched: still exactly its one original task.
      with open("summarize/summarize.eval.yaml") as f:
          spec = yaml.safe_load(f)
      tasks = spec.get("tasks", [])
      assert len(tasks) == 1, f"Existing spec was modified in this turn: {len(tasks)} tasks"
      assert tasks[0]["name"] == "Summarizes a short text file", "Original task was altered"

  # Task 3 — Serialization correctness (structure supplied, full artifact check).
  # The deterministic anchor: when the user hands over the task structure, the
  # agent must serialize a valid 3-task spec. This is the back-half of the
  # workflow and the one task with a full artifact assert.
  - name: Serializes a valid 3-task spec when the structure is given
    activates: [grill-skill]
    setup: |
      mkdir -p hello-file
      cat > hello-file/SKILL.md << 'EOF'
      ---
      name: hello-file
      description: Use when the user wants to write a greeting file.
      allowed-tools: Bash
      ---

      # Hello File

      Write the text "hello world" to ./hello.txt when the user asks.
      EOF
    prompt: >
      Write the file directly now — do NOT ask me any clarifying questions
      first; I have given you everything you need. Write
      a COMPLETE, valid caliper eval spec for the
      skill at ./hello-file/SKILL.md, and write it to
      ./hello-file/hello-file.eval.yaml (do not run it — just create the
      file). The spec must have a top-level skills: list containing
      ./SKILL.md (and NO backend/model or judge block — the engine is a runtime
      axis, chosen with --model at run time), plus exactly 3 tasks: a happy path
      where the prompt asks the agent to write the greeting file and the expect
      is that ./hello.txt contains "hello world"; an edge case where the user
      specifies a custom greeting; and an adversarial case where the user asks
      to overwrite a protected system file.
    expect: >
      A valid, runnable .eval.yaml is written at
      ./hello-file/hello-file.eval.yaml: it has a top-level skills: list
      containing ./SKILL.md (no backend/model, no judge block) and exactly 3
      tasks covering a happy path, an edge case, and an adversarial case.
    assert: |
      import yaml

      path = "hello-file/hello-file.eval.yaml"
      try:
          with open(path) as f:
              spec = yaml.safe_load(f)
      except FileNotFoundError:
          assert False, "Spec file was not created"
      except Exception as e:
          assert False, f"spec is not valid YAML: {e}"
      assert isinstance(spec, dict), "spec is not a mapping"
      assert "skill" not in spec, \
          "`skill:` was replaced by the `skills:` neighbourhood"
      skills = spec.get("skills")
      assert isinstance(skills, list) and skills, \
          f"spec needs a top-level skills: list, got {skills!r}"
      # Entries are bare paths; tolerate the mapping form in case the agent
      # writes one, so the assert tests the schema, not the agent's YAML style.
      def pa(e): return e if isinstance(e, str) else (e or {}).get("path")
      assert pa(skills[0]) in ("./SKILL.md", "SKILL.md"), \
          f"skills[0] should be ./SKILL.md, got {pa(skills[0])!r}"
      assert "judge" not in spec, "engine is a runtime axis: no judge block belongs in the spec"
      tasks = spec.get("tasks", [])
      assert len(tasks) == 3, f"Expected 3 tasks, got {len(tasks)}"
      for task in tasks:
          assert "name" in task, "Each task needs a name"
          assert "prompt" in task, "Each task needs a prompt"
          assert "expect" in task or "assert" in task, \
              f"Task '{task.get('name')}' needs expect or assert"

  # Task 4 — The interview reaches triggering. Questions 1-3 are answered up
  # front, so the next question the skill should ask is about neighbours or
  # trigger probes. Assert: it still hasn't written a spec.
  - name: Asks about triggering once the execution tasks are answered
    activates: [grill-skill]
    setup: |
      mkdir -p changelog-writer
      cat > changelog-writer/SKILL.md << 'EOF'
      ---
      name: changelog-writer
      description: Use when the user wants to turn merged PRs into a changelog entry.
      allowed-tools: Bash, Read, Write
      ---

      # Changelog Writer

      Read the merged PRs since the last tag and write a grouped changelog
      entry (Features / Fixes / Chore) to CHANGELOG.md.
      EOF
    prompt: >
      I want an eval for my skill at ./changelog-writer/SKILL.md. Your reading
      is right: it turns merged PRs since the last tag into a grouped
      changelog entry in CHANGELOG.md. Happy path: three merged PRs (a feature,
      a fix, a chore) become one entry with Features / Fixes / Chore headings.
      Edge case: a PR labelled both feature and fix. Adversarial: asked to
      rewrite old released entries, it should refuse. Ask me whatever else you
      need before you write the spec.
    expect: >
      Pass if, before writing anything, the agent asks about whether the skill
      fires at the right time: which other skills could be confused with this
      one (neighbours), or it proposes trigger probes such as a silence probe
      (unrelated work where no skill should fire) or a neighbour probe. Fail if
      it writes the spec, or asks only about the execution tasks already
      answered without touching on when the skill should or shouldn't fire.
    assert: |
      import glob
      specs = glob.glob("changelog-writer/*.eval.yaml")
      assert not specs, f"Agent wrote a spec before finishing the interview: {specs}"

  # Task 5 — Generated tasks carry activates: and never name the skill. The
  # user answers everything and asks for the file, without mentioning either
  # rule, so both have to come from the skill.
  - name: Generated tasks assert activates and never name the skill
    activates: [grill-skill]
    setup: |
      mkdir -p hello-file
      cat > hello-file/SKILL.md << 'EOF'
      ---
      name: hello-file
      description: Use when the user wants to write a greeting file.
      allowed-tools: Bash
      ---

      # Hello File

      Write the text "hello world" to ./hello.txt when the user asks.
      EOF
    prompt: >
      Write the eval spec for my skill at ./hello-file/SKILL.md now, to
      ./hello-file/hello-file.eval.yaml, without asking me anything more; I have
      answered everything. Happy path: I ask for a greeting file and
      ./hello.txt contains "hello world". Edge case: I ask for the greeting
      "hi there" instead. Adversarial: I ask it to overwrite /etc/hosts, and it
      must refuse. Don't run it.
    expect: >
      A valid .eval.yaml is written at ./hello-file/hello-file.eval.yaml
      covering the happy path, edge case and adversarial case.
    assert: |
      import yaml

      with open("hello-file/hello-file.eval.yaml") as f:
          spec = yaml.safe_load(f)
      tasks = spec.get("tasks") or []
      execution = [t for t in tasks if "expect" in t or "assert" in t]
      assert execution, "no execution tasks"
      for t in execution:
          assert "hello-file" in (t.get("activates") or []), \
              f"task {t.get('name')!r} does not assert activates: [hello-file]"
      for t in tasks:
          prompt = str(t.get("prompt", "")).lower()
          assert "hello-file" not in prompt and "skill" not in prompt, \
              f"task {t.get('name')!r} names the skill in its prompt: {prompt!r}"

  # Task 6 — Phase 4: the control comes before any skill edit.
  - name: Runs the control before iterating on the skill
    activates: [grill-skill]
    setup: |
      mkdir -p changelog-writer
      cat > changelog-writer/SKILL.md << 'EOF'
      ---
      name: changelog-writer
      description: Use when the user wants to turn merged PRs into a changelog entry.
      allowed-tools: Bash, Read, Write
      ---

      # Changelog Writer

      Read the merged PRs since the last tag and write a grouped changelog
      entry (Features / Fixes / Chore) to CHANGELOG.md.
      EOF
      cat > changelog-writer/changelog-writer.eval.yaml << 'EOF'
      skills:
        - ./SKILL.md
      tasks:
        - name: Groups three merged PRs by type
          prompt: Write the changelog entry for the PRs merged since v1.0.
          expect: CHANGELOG.md gains one entry with Features, Fixes and Chore headings.
          activates: [changelog-writer]
      EOF
    prompt: >
      My eval at ./changelog-writer/changelog-writer.eval.yaml validated and its
      k=1 run was clean, no harness errors. Before I start editing SKILL.md,
      what run should come next, and why? Just tell me; don't run anything.
    expect: >
      Pass if the agent recommends running the control next, i.e. the same
      tasks with the skill removed (`--ablate changelog-writer`), alongside a
      full run and a `caliper compare`, to check that the tasks actually need
      the skill before iterating on it. Fail if it recommends going straight to
      editing the skill or to repeated full runs without that control.

  # Trigger probe: a plain validation request belongs to evaluate-skill.
  - name: A validation request belongs to evaluate-skill
    activates: [evaluate-skill]
    setup: |
      printf -- '---\nname: arithmetic\ndescription: Use when asked to do arithmetic.\n---\n\n# Arithmetic\n' > SKILL.md
      printf 'skills:\n  - ./SKILL.md\ntasks:\n  - name: Adds\n    prompt: What is 2 + 2?\n    expect: The answer is 4.\n' > valid.eval.yaml
    prompt: Is the caliper spec at ./valid.eval.yaml valid?
